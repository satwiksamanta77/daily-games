name: Notify site rebuild (wordsolverx pages)

# After any batch run completes, tell the wordsolverx frontend repo
# (toviralideasyt7/wordsJi) to rebuild its pages. The site bakes each
# answer-today page's video section from this repo's database at build
# time (published video -> click-to-play facade, not yet published ->
# "Video will be published soon" placeholder), so a rebuild is how a
# freshly published video appears on its page. wordsJi's
# publish-pages.yml already listens for the repository_dispatch event
# type "pages-publish-requested".
#
# The dispatch fires on EVERY completed batch run, whatever its
# conclusion: games publish one by one during a run, so even a run
# that ends failed may have landed new publications. The concurrency
# group coalesces bursts into at most one queued extra run.
#
# Auth: secrets.GIT_TOKEN — a fine-grained PAT with permission to call
# the dispatches API on toviralideasyt7/wordsJi (added 2026-10-21).

on:
  workflow_run:
    workflows:
      - "ALL videos - every game parallel"
      - "Batch A 9pm IST - seq-gated games"
      - "Batch A dawn fix-up (US-rolled boards)"
      - "Batch B marveldle - own rebuild window"
      - "Batch C 10:30pm IST - nerdle next-day"
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: notify-site-rebuild
  cancel-in-progress: false

jobs:
  notify:
    name: POST pages-publish-requested to wordsJi
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to toviralideasyt7/wordsJi
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          status=$(curl -sS -o /tmp/dispatch-response.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GIT_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/toviralideasyt7/wordsJi/dispatches \
            -d '{"event_type":"pages-publish-requested"}')
          echo "wordsJi dispatches API HTTP status: ${status}"
          if [ -s /tmp/dispatch-response.txt ]; then
            echo "Response body:"
            cat /tmp/dispatch-response.txt
          fi
          if [ "${status}" != "204" ]; then
            echo "::error::Dispatch not accepted (expected 204, got ${status})"
            exit 1
          fi
          echo "Dispatch accepted: wordsJi publish-pages workflow will rebuild the site."
