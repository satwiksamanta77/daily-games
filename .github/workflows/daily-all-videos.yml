name: ALL videos - every game parallel

on:
  workflow_dispatch:
    inputs:
      game:
        description: 'Single game (empty = whole matrix)'
        required: false
        default: ''
      date:
        description: 'Puzzle date YYYY-MM-DD (empty = auto per-batch clock)'
        required: false
        default: ''
      force:
        description: 'Force re-render even if database says done (true/false)'
        required: false
        default: 'false'

jobs:
  batch-a:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        game: [betweenle, colordle, colorfle, framed, searchle, phrazle, phoodle, contexto, semantle, worldle, worgle, countryle, nerdle]
    # Workflow-honesty (fix-loop iter 10): game selection lives at the
    # JOB level. A job whose game is not selected shows SKIPPED,
    # never Success. The old step-level skip + always() upload/commit
    # let unselected jobs report green with zero work (hollow-green).
    # schedule-triggered runs always run (event_name clause).
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.game || '') == '' || inputs.game == matrix.game }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg xvfb
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          python -m playwright install --with-deps chromium
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save seedrandom 2>&1 | tail -1 || true
      - name: Run game (fails on unsolved - saves artifact)
        id: run-game
        env:
          HEADLESS: 'true'
          TZ_OFFSET_MINUTES: '540'
          BROWSER_TZ: 'Pacific/Kiritimati'
          CURSOR_OVERLAY: 'off'
          FORCE_REGENERATE: ${{ inputs.force }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then export FAKE_DATE_ISO="${{ inputs.date }}T00:05:00"; echo "PINNED DATE $FAKE_DATE_ISO"; fi
          RUN() { if [ "$1" = "countryle" ] || [ "$1" = "worgle" ] || [ "$1" = "betweenle" ]; then
            HEADLESS=false xvfb-run -a python -u runner.py --game "$1";
          else python -u runner.py --game "$1"; fi; }
          RUN ${{ matrix.game }}
      - name: Verify game produced output (fail on zero work)
        id: verify-output
        # Runs only when Run game SUCCEEDED (default success() condition).
        # If Run game failed (unsolved), this step is skipped and the job
        # stays failed while Upload still ships the failure artifact.
        # A no-duplicate skip (result.json skipped=true, no fresh video)
        # is legitimate auditable work and passes. Anything else with no
        # result.json, or a fresh attempt with no video, FAILS the job.
        run: |
          python - <<'PYEOF'
          import json, pathlib, sys
          d = pathlib.Path("videos/${{ matrix.game }}")
          res = d / "result.json"
          if not res.is_file():
              print(f"::error::Run game produced no result.json in {d} (zero auditable work)")
              sys.exit(1)
          try:
              r = json.loads(res.read_text())
          except Exception as e:
              print(f"::error::result.json in {d} is not valid JSON: {e}")
              sys.exit(1)
          if r.get("skipped") is True:
              print(f"verify-output: legit no-duplicate skip (evidence={r.get('evidence')})")
              sys.exit(0)
          if not list(d.glob("*.mp4")):
              print(f"::error::Run game produced no video artifact in {d} (fresh attempt, no .mp4)")
              sys.exit(1)
          print(f"verify-output: result.json + video present in {d}")
          PYEOF
      - name: Upload video artifact
        if: ${{ always() && steps.run-game.outcome != 'skipped' && steps.verify-output.outcome != 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.game }}
          path: |
            videos/${{ matrix.game }}/*.mp4
            videos/${{ matrix.game }}/*.log
            videos/${{ matrix.game }}/qc_*.json
            videos/${{ matrix.game }}/telemetry_*.json
            videos/${{ matrix.game }}/result.json
            videos/${{ matrix.game }}/stall_*.png
            videos/${{ matrix.game }}/shot_win.png
            videos/${{ matrix.game }}/board_*.png
          retention-days: 7
          if-no-files-found: error
      - name: Commit database record
        if: ${{ always() && steps.run-game.outcome != 'skipped' && steps.verify-output.outcome != 'failure' }}
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          # Never commit a browser_state.json with completed nerdle
          # gameStates (fix-loop iter 6: rerun #5 replayed rerun #4's
          # won boards). Strip them before staging.
          python strip_nerdle_state.py || true
          git add database/ browser_state.json || true
          git diff --cached --quiet || git commit -m "db: ${{ matrix.game }} $(date -u +%F)"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -X theirs --autostash 2>/dev/null && git push 2>/dev/null && break; git rebase --abort 2>/dev/null; sleep 6; done || true
  batch-b:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        game: [waffle, canuckle, globle, batterup, marveldle]
    # Workflow-honesty (fix-loop iter 10): game selection lives at the
    # JOB level. A job whose game is not selected shows SKIPPED,
    # never Success. The old step-level skip + always() upload/commit
    # let unselected jobs report green with zero work (hollow-green).
    # schedule-triggered runs always run (event_name clause).
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.game || '') == '' || inputs.game == matrix.game }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg xvfb
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          python -m playwright install --with-deps chromium
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save seedrandom 2>&1 | tail -1 || true
      - name: Run game (fails on unsolved - saves artifact)
        id: run-game
        env:
          HEADLESS: 'true'
          TZ_OFFSET_MINUTES: '540'
          BROWSER_TZ: 'Pacific/Kiritimati'
          CURSOR_OVERLAY: 'off'
          FORCE_REGENERATE: ${{ inputs.force }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then export FAKE_DATE_ISO="${{ inputs.date }}T00:05:00"; echo "PINNED DATE $FAKE_DATE_ISO"; fi
          RUN() { if [ "$1" = "countryle" ] || [ "$1" = "worgle" ] || [ "$1" = "betweenle" ]; then
            HEADLESS=false xvfb-run -a python -u runner.py --game "$1";
          else python -u runner.py --game "$1"; fi; }
          RUN ${{ matrix.game }}
      - name: Verify game produced output (fail on zero work)
        id: verify-output
        # Runs only when Run game SUCCEEDED (default success() condition).
        # If Run game failed (unsolved), this step is skipped and the job
        # stays failed while Upload still ships the failure artifact.
        # A no-duplicate skip (result.json skipped=true, no fresh video)
        # is legitimate auditable work and passes. Anything else with no
        # result.json, or a fresh attempt with no video, FAILS the job.
        run: |
          python - <<'PYEOF'
          import json, pathlib, sys
          d = pathlib.Path("videos/${{ matrix.game }}")
          res = d / "result.json"
          if not res.is_file():
              print(f"::error::Run game produced no result.json in {d} (zero auditable work)")
              sys.exit(1)
          try:
              r = json.loads(res.read_text())
          except Exception as e:
