              sys.exit(1)
          if r.get("skipped") is True:
              print(f"verify-output: legit no-duplicate skip (evidence={r.get('evidence')})")
              sys.exit(0)
          if not list(d.glob("*.mp4")):
              print(f"::error::Run game produced no video artifact in {d} (fresh attempt, no .mp4)")
              sys.exit(1)
          print(f"verify-output: result.json + video present in {d}")
          PYEOF
      - name: Upload video artifact
        if: ${{ always() && steps.run-game.outcome != 'skipped' && steps.verify-output.outcome != 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.game }}
          path: |
            videos/${{ matrix.game }}/*.mp4
            videos/${{ matrix.game }}/*.log
            videos/${{ matrix.game }}/qc_*.json
            videos/${{ matrix.game }}/telemetry_*.json
            videos/${{ matrix.game }}/result.json
            videos/${{ matrix.game }}/stall_*.png
            videos/${{ matrix.game }}/shot_win.png
            videos/${{ matrix.game }}/board_*.png
          retention-days: 7
          if-no-files-found: error
      - name: Commit database record
        if: ${{ always() && steps.run-game.outcome != 'skipped' && steps.verify-output.outcome != 'failure' }}
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          # Never commit a browser_state.json with completed nerdle
          # gameStates (fix-loop iter 6: rerun #5 replayed rerun #4's
          # won boards). Strip them before staging.
          python strip_nerdle_state.py || true
          git add database/ browser_state.json || true
          git diff --cached --quiet || git commit -m "db: ${{ matrix.game }} $(date -u +%F)"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -X theirs --autostash 2>/dev/null && git push 2>/dev/null && break; git rebase --abort 2>/dev/null; sleep 6; done || true

  bundle:
    needs: [batch-a, batch-b]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download every per-game artifact
        uses: actions/download-artifact@v4
        with:
          pattern: video-*
          path: all-artifacts
          merge-multiple: false
      - name: Exclude unsolved games' finals from the pack
        # Fix-loop iter 6: the pack zips this run's artifacts, so an
        # unsolved game's assembled final (nerdle rerun #5: a 33 s final
        # for solved=False) would ship as if solved. Delete *_final_*.mp4
        # in any per-game dir whose result.json says solved=False.
        run: |
          python - <<'PYEOF'
          import json, pathlib
          root = pathlib.Path("all-artifacts")
          for res in sorted(root.glob("video-*/result.json")):
              try:
                  solved = json.loads(res.read_text()).get("solved")
              except Exception:
                  continue
              if solved is False:
                  for mp4 in res.parent.glob("*_final_*.mp4"):
                      print(f"bundle filter: dropping unsolved final {mp4}")
                      mp4.unlink()
          PYEOF
      - name: Zip into one pack
        run: |
          cd all-artifacts
          zip -r ../wordsolverx_all_videos.zip .
          ls -la ../wordsolverx_all_videos.zip
      - name: Upload single all-games pack
        uses: actions/upload-artifact@v4
        with:
          name: wordsolverx_all_videos
          path: wordsolverx_all_videos.zip
          retention-days: 7
          if-no-files-found: error


