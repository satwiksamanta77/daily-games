  bundle:
    needs: [batch-a-betweenle, batch-a-colordle, batch-a-colorfle, batch-a-framed, batch-a-searchle, batch-a-phrazle, batch-a-phoodle, batch-a-contexto, batch-a-semantle, batch-a-worldle, batch-a-worgle, batch-a-countryle, batch-a-nerdle, batch-b-waffle, batch-b-canuckle, batch-b-globle, batch-b-batterup, batch-b-marveldle, batch-b-spotle]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download every per-game artifact
        uses: actions/download-artifact@v4
        with:
          pattern: video-*
          path: all-artifacts
          merge-multiple: false
      - name: Exclude unsolved games' finals and gameplay from the pack
        # Fix-loop iter 6: the pack zips this run's artifacts, so an
        # unsolved game's assembled final (nerdle rerun #5: a 33 s final
        # for solved=False) would ship as if solved. Delete *_final_*.mp4
        # in any per-game dir whose result.json says solved=False.
        # Fix-loop iter 19 (ANALYSIS16 §5): the finals gate held, but
        # the pack still shipped UNSOLVED raw gameplay —
        # video-nerdle/gameplay_1080.mp4 (339 s, maxi unwon) and
        # video-worldle/gameplay_1080.mp4 (366 s, Capital partial) —
        # because the filter only deleted finals. Root cause: the pack
        # zipped per-game dirs wholesale instead of finals-only. Now
        # EVERY mp4 in a solved=False dir is dropped from the staging
        # copy (finals, gameplay, quarantined files alike). The
        # per-game artifacts themselves are untouched — this deletes
        # from the downloaded staging copy only. A follow-up
        # verification step fails the job if any mp4 survives in an
        # unsolved dir (fail-closed).
        run: |
          python - <<'PYEOF'
          import json, pathlib
          root = pathlib.Path("all-artifacts")
          for res in sorted(root.glob("video-*/result.json")):
              try:
                  solved = json.loads(res.read_text()).get("solved")
              except Exception:
                  continue
              if solved is False:
                  for mp4 in sorted(res.parent.glob("*.mp4")):
                      print(f"bundle filter: dropping unsolved video {mp4}")
                      mp4.unlink()
          PYEOF
      - name: Exclude raw gameplay from the pack (finals-only)
        # Fix-loop iter 22 (P1, ANALYSIS19 §5): the bundle contract
        # is FINALS-ONLY. The iter-19 filter dropped every mp4 in
        # unsolved dirs, but SOLVED games' raw gameplay_1080.mp4
        # still rode along — and Nerdle's raw (275.6 s vs the
        # final's 230.3 s) still contains the CUT Speed chapter
        # (unwon footage inside a solved game's dir), because the
        # raw is polished BEFORE the unwon chapter is cut. Delete
        # gameplay_1080.mp4 from EVERY per-game dir in the staging
        # copy, solved or not, so the pack ships *_final_*.mp4
        # ONLY. The per-game artifacts themselves are untouched —
        # they still hold raw + final; only the bundle pack is
        # finals-only.
        run: |
          python - <<'PYEOF'
          import pathlib
          root = pathlib.Path("all-artifacts")
          for raw in sorted(root.glob("video-*/gameplay_1080.mp4")):
              print(f"bundle filter: dropping raw gameplay {raw} "
                    f"(finals-only pack)")
              raw.unlink()
          PYEOF
      - name: Verify no unsolved video survived the bundle filter
        # Fail-closed: if the filter above ever stops deleting (glob
        # change, new filename), the job fails instead of shipping
        # unsolved footage as if it were a solved video. Also
        # verifies the finals-only contract: no raw gameplay_1080.mp4
        # may survive in ANY per-game dir, solved or not.
        run: |
          python - <<'PYEOF'
          import json, pathlib, sys
          root = pathlib.Path("all-artifacts")
          leaked = []
          for res in sorted(root.glob("video-*/result.json")):
              try:
                  solved = json.loads(res.read_text()).get("solved")
              except Exception:
                  continue
              if solved is False:
                  leaked.extend(sorted(res.parent.glob("*.mp4")))
          if leaked:
              print("bundle filter LEAK: unsolved videos remain:")
              for mp4 in leaked:
                  print(f"  {mp4}")
              sys.exit(1)
          print("bundle filter verified: no mp4 in any solved=False dir")
          raw = sorted(root.glob("video-*/gameplay_1080.mp4"))
          if raw:
              print("bundle filter LEAK: raw gameplay survived "
                    "(finals-only pack):")
              for mp4 in raw:
                  print(f"  {mp4}")
              sys.exit(1)
          print("bundle filter verified: no raw gameplay_1080.mp4 "
                "in any dir (finals-only pack)")
          PYEOF
      - name: Zip into one pack
        run: |
          cd all-artifacts
          zip -r ../wordsolverx_all_videos.zip .
          ls -la ../wordsolverx_all_videos.zip
      - name: Upload single all-games pack
        uses: actions/upload-artifact@v4
        with:
          name: wordsolverx_all_videos
          path: wordsolverx_all_videos.zip
          retention-days: 7
          if-no-files-found: error


