name: ALL videos - every game parallel

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Puzzle date YYYY-MM-DD (empty = auto per-batch clock)'
        required: false
        default: ''
      force:
        description: 'Force re-render even if database says done (true/false)'
        required: false
        default: 'false'

jobs:
  batch-a:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        game: [betweenle, colordle, colorfle, framed, searchle, phrazle, phoodle, contexto, semantle, worldle, worgle, countryle, nerdle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          python -m playwright install --with-deps chromium
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save seedrandom 2>&1 | tail -1 || true
      - name: Run game (never fails - saves artifact)
        env:
          HEADLESS: 'true'
          TZ_OFFSET_MINUTES: '540'
          BROWSER_TZ: 'Asia/Tokyo'
          FORCE_REGENERATE: ${{ inputs.force }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then export FAKE_DATE_ISO="${{ inputs.date }}T00:05:00"; echo "PINNED DATE $FAKE_DATE_ISO"; fi
          python runner.py --game ${{ matrix.game }} || true
      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.game }}
          path: |
            videos/${{ matrix.game }}/*.mp4
            videos/${{ matrix.game }}/*.log
          retention-days: 7
          if-no-files-found: warn
      - name: Commit database record
        if: always()
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add database/ || true
          git diff --cached --quiet || git commit -m "db: ${{ matrix.game }} $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase 2>/dev/null && git push 2>/dev/null && break || sleep 7; done || true
  batch-b:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        game: [waffle, canuckle, globle, batterup, marveldle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          python -m playwright install --with-deps chromium
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save seedrandom 2>&1 | tail -1 || true
      - name: Run game (never fails - saves artifact)
        env:
          HEADLESS: 'true'
          TZ_OFFSET_MINUTES: '0'
          BROWSER_TZ: 'Etc/UTC'
          FORCE_REGENERATE: ${{ inputs.force }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then export FAKE_DATE_ISO="${{ inputs.date }}T00:05:00"; echo "PINNED DATE $FAKE_DATE_ISO"; fi
          python runner.py --game ${{ matrix.game }} || true
      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.game }}
          path: |
            videos/${{ matrix.game }}/*.mp4
            videos/${{ matrix.game }}/*.log
          retention-days: 7
          if-no-files-found: warn
      - name: Commit database record
        if: always()
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add database/ || true
          git diff --cached --quiet || git commit -m "db: ${{ matrix.game }} $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase 2>/dev/null && git push 2>/dev/null && break || sleep 7; done || true

  bundle:
    needs: [batch-a, batch-b]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download every per-game artifact
        uses: actions/download-artifact@v4
        with:
          pattern: video-*
          path: all-artifacts
          merge-multiple: false
      - name: Zip into one pack
        run: |
          cd all-artifacts
          zip -r ../wordsolverx_all_videos.zip .
          ls -la ../wordsolverx_all_videos.zip
      - name: Upload single all-games pack
        uses: actions/upload-artifact@v4
        with:
          name: wordsolverx_all_videos
          path: wordsolverx_all_videos.zip
          retention-days: 7
          if-no-files-found: error
