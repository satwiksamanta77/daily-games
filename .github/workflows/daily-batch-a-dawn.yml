name: Batch A dawn fix-up (US-rolled boards)

# The 21:00-IST batch targets the NEXT day's board. Client-seeded sites serve
# it immediately under the fake clock, but server-keyed sites (US rollover)
# only flip at ~04:00-05:30 UTC. Those runs stale-fail at 21:00 (no DB record
# is written as solved), and THIS batch picks them up once the real board
# exists. The no-duplicate guard skips everything the 9pm batch already made.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      game:
        description: 'Single game (empty = all Batch A)'
        required: false
        default: ''
      force:
        description: 'Force re-render even if database says done (true/false)'
        required: false
        default: 'false'

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        game: [betweenle, colordle, colorfle, framed, searchle, phrazle, phoodle, contexto, semantle, worldle, worgle, countryle, nerdle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg xvfb
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          python -m playwright install --with-deps chromium
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save seedrandom 2>&1 | tail -1 || true
      - name: Run game (never fails job without secrets - local mode, saves artifact)
        env:
          HEADLESS: 'true'
          TZ_OFFSET_MINUTES: '540'
          BROWSER_TZ: 'Asia/Kolkata'
          FORCE_REGENERATE: ${{ inputs.force }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          RUN() { if [ "$1" = "countryle" ] || [ "$1" = "worgle" ]; then
            HEADLESS=false xvfb-run -a python runner.py --game "$1" || true;
          else python runner.py --game "$1" || true; fi; }
          if [ -n "${{ inputs.game }}" ]; then RUN "${{ inputs.game }}"; else RUN ${{ matrix.game }}; fi
      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dawn-video-${{ matrix.game }}
          path: |
            videos/${{ matrix.game }}/*.mp4
            videos/${{ matrix.game }}/*.log
            videos/${{ matrix.game }}/qc_*.json
            videos/${{ matrix.game }}/telemetry_*.json
            videos/${{ matrix.game }}/result.json
          retention-days: 7
          if-no-files-found: warn
      - name: Commit database record
        if: always()
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add database/ browser_state.json || true
          git diff --cached --quiet || git commit -m "db: ${{ matrix.game }} $(date -u +%F) dawn"
          for i in 1 2 3 4 5; do git pull --rebase 2>/dev/null && git push 2>/dev/null && break || sleep 7; done || true
